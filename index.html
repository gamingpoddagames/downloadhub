<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownloadHub - Free Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">📁 DownloadHub</div>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#files">Files</a>
                <a href="#about">About</a>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <h1>🚀 Free Premium Downloads</h1>
            <p>High-quality files ready for instant download</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search files..." onkeyup="searchFiles()">
                <button onclick="searchFiles()">🔍 Search</button>
            </div>
        </div>
    </section>

    <section id="files" class="files-section">
        <div class="container">
            <h2>📂 Available Downloads</h2>
            <div class="file-grid" id="fileGrid"></div>
        </div>
    </section>

    <section id="about" class="about-section">
        <div class="container">
            <h2>About</h2>
            <p>Download premium files for free. Support creators with every download!</p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 DownloadHub. Supported by affiliate links.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
